    - data:
        code: "import html\nimport json\nimport re\n\n\ndef main(analysis: dict, candidates_json: str, report_date: str, snapshot_at:\
          \ str) -> dict:\n    if not isinstance(analysis, dict):\n        raise ValueError(\"Bind analysis to the parsed\
          \ analysis object or LLM structured_output\")\n    if not re.fullmatch(r\"\\d{4}-\\d{2}-\\d{2}\", report_date):\n\
          \        raise ValueError(\"Invalid report date\")\n    candidates = json.loads(candidates_json)\n    known = {v[\"\
          video_id\"]: v for v in candidates}\n    rows = analysis.get(\"recommendations\")\n    themes = analysis.get(\"\
          themes\")\n    if not isinstance(rows, list) or not isinstance(themes, list):\n        raise ValueError(\"Missing\
          \ recommendations or themes\")\n    if len(rows) > 10 or len(themes) > 5:\n        raise ValueError(\"Too many recommendations\
          \ or themes\")\n\n    def text_field(obj, name, limit):\n        value = obj.get(name)\n        if not isinstance(value,\
          \ str) or not value.strip() or len(value) > limit:\n            raise ValueError(\"Invalid analysis field: \" +\
          \ name)\n        return value.strip()\n\n    selected = []\n    seen = set()\n    lane_counts = {\"meme\": 0, \"\
          brand\": 0}\n    for row in rows:\n        if not isinstance(row, dict):\n            raise ValueError(\"Invalid\
          \ recommendation\")\n        video_id = row.get(\"video_id\")\n        category = row.get(\"category\")\n      \
          \  if video_id not in known or video_id in seen:\n            raise ValueError(\"Unknown or duplicated recommended\
          \ video ID\")\n        if category not in lane_counts or row.get(\"confidence\") not in (\"low\", \"medium\", \"\
          high\"):\n            raise ValueError(\"Invalid category or confidence\")\n        seen.add(video_id)\n       \
          \ # 原始链接、标题及统计数据只从 API 数据回填。\n        item = dict(known[video_id])\n        item.update({\"category\": category,\
          \ \"confidence\": row[\"confidence\"]})\n        for field in (\"topic\", \"summary\", \"recommendation_reason\"\
          , \"adaptation_idea\"):\n            item[field] = text_field(row, field, 600)\n        # 先校验每条结果，再按模型给出的顺序保留每类前五条。\n\
          \        # 超额结果也必须通过来源与字段校验。\n        if lane_counts[category] < 5:\n            selected.append(item)\n       \
          \     lane_counts[category] += 1\n\n    clean_themes = []\n    for theme in themes:\n        if not isinstance(theme,\
          \ dict):\n            raise ValueError(\"Invalid theme\")\n        ids = theme.get(\"evidence_video_ids\")\n   \
          \     if not isinstance(ids, list) or not 2 <= len(ids) <= 10:\n            raise ValueError(\"A recurring theme\
          \ needs 2 to 10 supporting videos\")\n        if any(not isinstance(i, str) or i not in known for i in ids) or len(set(ids))\
          \ != len(ids):\n            raise ValueError(\"Invalid theme evidence\")\n        clean_themes.append({\n      \
          \      \"name\": text_field(theme, \"name\", 100),\n            \"observation\": text_field(theme, \"observation\"\
          , 600),\n            \"evidence_video_ids\": ids,\n        })\n\n    subject = \"Meme 与品牌创意选题日报 | \" + report_date\n\
          \    scope = \"Meme：近 3 天；品牌创意：近 30 天。英文关键词；US 可观看地区筛选。\"\n    basis = \"依据标题、简介和统计数据初筛；创意建议为策划推演，具体视频内容需点开核实。\"\
          \n    plain = [subject, scope, \"采集时间（UTC）：\" + snapshot_at,\n             \"候选数：\" + str(len(candidates)), basis,\
          \ \"\"]\n    esc = lambda s: html.escape(str(s), quote=True)\n    parts = ['<!doctype html><html lang=\"zh-CN\"\
          ><meta charset=\"utf-8\"><body>',\n             \"<h1>\" + esc(subject) + \"</h1>\", \"<p>\" + esc(scope) + \"</p>\"\
          ,\n             \"<p>采集时间（UTC）：\" + esc(snapshot_at) + \"；候选数：\" + str(len(candidates)) + \"</p>\",\n          \
          \   \"<p>\" + esc(basis) + \"</p>\"]\n    if clean_themes:\n        parts.append(\"<h2>本次样本中的共同主题</h2>\")\n    \
          \    plain.append(\"本次样本中的共同主题\")\n        for theme in clean_themes:\n            plain.extend([theme[\"name\"\
          ], theme[\"observation\"]])\n            parts.append(\"<h3>\" + esc(theme[\"name\"]) + \"</h3><p>\" + esc(theme[\"\
          observation\"]) + \"</p>\")\n            for video_id in theme[\"evidence_video_ids\"]:\n                source\
          \ = known[video_id]\n                plain.append(source[\"title\"] + \" \" + source[\"url\"])\n               \
          \ parts.append('<p><a href=\"' + esc(source[\"url\"]) + '\">' + esc(source[\"title\"]) + \"</a></p>\")\n    for\
          \ lane, label in [(\"meme\", \"Meme / 搞笑选题\"), (\"brand\", \"品牌创意参考\")]:\n        plain.extend([\"\", label])\n\
          \        parts.append(\"<h2>\" + label + \"</h2>\")\n        lane_rows = [row for row in selected if row[\"category\"\
          ] == lane]\n        if not lane_rows:\n            plain.append(\"本次样本暂无足够相关的推荐。\")\n            parts.append(\"\
          <p>本次样本暂无足够相关的推荐。</p>\")\n        for row in lane_rows:\n            count = lambda value: \"未提供\" if value is None\
          \ else str(value)\n            stats = \"播放 \" + count(row[\"view_count\"]) + \" / 点赞 \" + count(row[\"like_count\"\
          ]) + \" / 评论 \" + count(row[\"comment_count\"])\n            plain.extend([row[\"title\"], row[\"url\"], \"频道：\"\
          \ + row[\"channel\"],\n                          \"发布时间：\" + row[\"published_at\"], stats])\n            parts.append('<h3><a\
          \ href=\"' + esc(row[\"url\"]) + '\">' + esc(row[\"title\"]) + \"</a></h3>\")\n            parts.append(\"<p>频道：\"\
          \ + esc(row[\"channel\"]) + \"；发布时间：\" + esc(row[\"published_at\"]) + \"</p>\")\n            parts.append(\"<p>\"\
          \ + esc(stats) + \"</p>\")\n            for key, title in [(\"topic\", \"主题\"), (\"summary\", \"元数据摘要\"),\n    \
          \                           (\"recommendation_reason\", \"推荐理由\"), (\"adaptation_idea\", \"可尝试的创意\")]:\n       \
          \         plain.append(title + \"：\" + row[key])\n                parts.append(\"<p><b>\" + title + \"：</b>\" +\
          \ esc(row[key]) + \"</p>\")\n            plain.append(\"元数据判断置信度：\" + row[\"confidence\"])\n            parts.append(\"\
          <p>元数据判断置信度：\" + esc(row[\"confidence\"]) + \"</p>\")\n    parts.append(\"</body></html>\")\n    return {\n    \
          \    \"subject\": subject,\n        \"body_text\": \"\\n\".join(plain),\n        \"body_html\": \"\\n\".join(parts),\n\
          \        \"report_json\": json.dumps({\"date\": report_date, \"snapshot_at\": snapshot_at,\n                   \
          \                \"candidate_count\": len(candidates), \"themes\": clean_themes,\n                             \
          \      \"recommendations\": selected}, ensure_ascii=False),\n        \"selected_count\": len(selected),\n    }\n"
        code_language: python3

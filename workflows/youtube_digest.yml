    - data:
        code: "import base64\nimport json\nfrom datetime import datetime, timezone\nfrom email import policy\nfrom email.headerregistry\
          \ import Address\nfrom email.message import EmailMessage\nfrom email.utils import format_datetime\n\n\ndef main(sender:\
          \ str, recipient: str, subject: str,\n         body_text: str, body_html: str) -> dict:\n    def mailbox(value,\
          \ label):\n        if not isinstance(value, str) or any(ord(c) < 32 or ord(c) == 127 for c in value):\n        \
          \    raise ValueError(label + \" must be one plain email address\")\n        value = value.strip()\n        if not\
          \ value.isascii() or any(c in value for c in \" ,;<>\\t\"):\n            raise ValueError(label + \" must be one\
          \ plain ASCII email address\")\n        try:\n            address = Address(addr_spec=value)\n        except ValueError:\n\
          \            raise ValueError(label + \" is not a valid email address\") from None\n        if not address.username\
          \ or not address.domain or \".\" not in address.domain:\n            raise ValueError(label + \" is not a valid\
          \ email address\")\n        return value\n\n    sender = mailbox(sender, \"sender\")\n    recipient = mailbox(recipient,\
          \ \"recipient\")\n    if not isinstance(subject, str) or not subject.strip() or len(subject) > 250:\n        raise\
          \ ValueError(\"subject must be non-empty text of at most 250 characters\")\n    if any(ord(c) < 32 or ord(c) ==\
          \ 127 for c in subject):\n        raise ValueError(\"subject must not contain control characters\")\n    if not\
          \ isinstance(body_text, str) or not body_text.strip():\n        raise ValueError(\"body_text must be non-empty text\"\
          )\n    if not isinstance(body_html, str) or not body_html.strip():\n        raise ValueError(\"body_html must be\
          \ non-empty HTML\")\n\n    message = EmailMessage(policy=policy.SMTP)\n    message[\"From\"] = sender\n    message[\"\
          To\"] = recipient\n    message[\"Subject\"] = subject.strip()\n    message[\"Date\"] = format_datetime(datetime.now(timezone.utc))\n\
          \    message.set_content(body_text, charset=\"utf-8\")\n    message.add_alternative(body_html, subtype=\"html\"\
          , charset=\"utf-8\")\n    raw = base64.urlsafe_b64encode(message.as_bytes()).decode(\"ascii\")\n    return {\"raw\"\
          : raw, \"request_body\": json.dumps({\"raw\": raw})}\n"

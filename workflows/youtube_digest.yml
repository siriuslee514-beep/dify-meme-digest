    - data:
        code: "import json\nimport re\n\n\ndef main(meme_body: str, brand_body: str) -> dict:\n    sources = {}\n\n    responses\
          \ = [\n        (\"meme\", meme_body),\n        (\"brand\", brand_body),\n    ]\n\n    for lane, body in responses:\n\
          \        data = json.loads(body)\n\n        if not isinstance(data, dict) or \"error\" in data:\n            raise\
          \ ValueError(\"YouTube 请求结果异常：\" + lane)\n\n        if not isinstance(data.get(\"items\"), list):\n            raise\
          \ ValueError(\"返回结果缺少视频列表：\" + lane)\n\n        for item in data[\"items\"]:\n            video_id = item.get(\"\
          id\", {}).get(\"videoId\", \"\")\n\n            if not re.fullmatch(r\"[A-Za-z0-9_-]{11}\", video_id):\n       \
          \         continue\n\n            # 相同视频 ID 只保留一次\n            sources.setdefault(video_id, [])\n\n            #\
          \ 记录这个视频来自哪一路搜索\n            if lane not in sources[video_id]:\n                sources[video_id].append(lane)\n\
          \n    if len(sources) > 40:\n        raise ValueError(\"候选超过 40 条，需要增加分批处理\")\n\n    return {\n        \"video_ids\"\
          : \",\".join(sources.keys()),\n        \"sources_json\": json.dumps(sources, ensure_ascii=False),\n        \"count\"\
          : len(sources),\n    }"
        code_language: python3
        desc: 同一个视频只保留一次，并记录它来自哪一路搜索
        outputs:
          count:
            children: null
            type: number
          sources_json:
            children: null
            type: string
          video_ids:
            children: null
            type: string

    - data:
        code: "import html\nimport json\nimport re\n\n\ndef main(videos_body: str, sources_json: str, snapshot_at: str) ->\
          \ dict:\n    data = json.loads(videos_body)\n    sources = json.loads(sources_json)\n\n    if not isinstance(data,\
          \ dict) or \"error\" in data:\n        raise ValueError(\"YouTube 视频详情请求异常\")\n\n    if not isinstance(data.get(\"\
          items\"), list):\n        raise ValueError(\"返回结果缺少视频列表\")\n\n    # 将统计数据转为数字；缺失的数据保留为空\n    def number(value):\n\
          \        if value is None:\n            return None\n        try:\n            parsed = int(value)\n           \
          \ return parsed if parsed >= 0 else None\n        except (TypeError, ValueError):\n            return None\n\n \
          \   candidates = []\n    seen = set()\n\n    for item in data[\"items\"]:\n        video_id = item.get(\"id\", \"\
          \")\n\n        if video_id not in sources or video_id in seen:\n            continue\n\n        if not re.fullmatch(r\"\
          [A-Za-z0-9_-]{11}\", video_id):\n            continue\n\n        snippet = item.get(\"snippet\", {})\n\n       \
          \ # 排除正在直播或预约直播的视频\n        if snippet.get(\"liveBroadcastContent\", \"none\") != \"none\":\n            continue\n\
          \n        statistics = item.get(\"statistics\", {})\n        seen.add(video_id)\n\n        candidates.append({\n\
          \            \"video_id\": video_id,\n            \"source_lanes\": sources[video_id],\n            \"title\": html.unescape(snippet.get(\"\
          title\", \"\"))[:300],\n            \"description\": html.unescape(\n                snippet.get(\"description\"\
          , \"\")\n            )[:1200],\n            \"channel\": html.unescape(\n                snippet.get(\"channelTitle\"\
          , \"\")\n            )[:200],\n            \"published_at\": snippet.get(\"publishedAt\", \"\"),\n            \"\
          duration\": item.get(\"contentDetails\", {}).get(\"duration\", \"\"),\n            \"view_count\": number(statistics.get(\"\
          viewCount\")),\n            \"like_count\": number(statistics.get(\"likeCount\")),\n            \"comment_count\"\
